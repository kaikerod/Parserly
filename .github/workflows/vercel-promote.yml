name: Promote Vercel Preview

on:
  workflow_dispatch:
    inputs:
      api_preview_url:
        description: Preview URL for parserly-api
        required: true
        type: string
      frontend_preview_url:
        description: Preview URL for parserly-web
        required: true
        type: string
      run_migrations:
        description: Run Alembic migrations before production promotion
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION || '39.3.0' }}
  VERCEL_SCOPE: ${{ vars.VERCEL_TEAM_SLUG || 'kaikerods-projects' }}

jobs:
  promote:
    name: Smoke, migrate, and promote
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        if: ${{ inputs.run_migrations }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Smoke test previews
        env:
          API_PREVIEW_URL: ${{ inputs.api_preview_url }}
          FRONTEND_PREVIEW_URL: ${{ inputs.frontend_preview_url }}
        run: node scripts/vercel-smoke.mjs

      - name: Run production migrations
        if: ${{ inputs.run_migrations }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set PRODUCTION_DATABASE_URL before running production migrations."
            exit 1
          fi

          if [ ! -f backend/alembic.ini ] && [ ! -f alembic.ini ]; then
            echo "::error::Alembic is not configured yet. Add migrations or rerun with run_migrations=false only when the release has no schema changes."
            exit 1
          fi

          python -m pip install -r backend/requirements-dev.txt

          if [ -f backend/alembic.ini ]; then
            cd backend
            alembic upgrade head
          else
            alembic -c alembic.ini upgrade head
          fi

      - name: Confirm migration skip
        if: ${{ ! inputs.run_migrations }}
        run: echo "Alembic migration step was skipped for this promotion."

      - name: Install pinned Vercel CLI
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Promote API preview
        env:
          API_PREVIEW_URL: ${{ inputs.api_preview_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Set VERCEL_TOKEN before promoting previews."
            exit 1
          fi

          vercel promote "${API_PREVIEW_URL%/}" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Promote frontend preview
        env:
          FRONTEND_PREVIEW_URL: ${{ inputs.frontend_preview_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel promote "${FRONTEND_PREVIEW_URL%/}" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
